services:
  elite-practo-sales-ai:
    build: .
    image: elite-practo-sales-ai:latest
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data
      SARVAM_VOICE_API_KEY: ${SARVAM_VOICE_API_KEY:-}
      SARVAM_ORG_ID: ${SARVAM_ORG_ID:-}
      SARVAM_WORKSPACE_ID: ${SARVAM_WORKSPACE_ID:-}
      SARVAM_AGENT_APP_ID: ${SARVAM_AGENT_APP_ID:-}
      SARVAM_AGENT_APP_VERSION: ${SARVAM_AGENT_APP_VERSION:-1}
      SARVAM_CONNECTION_ID: ${SARVAM_CONNECTION_ID:-}
      SARVAM_AGENT_PHONE_NUMBER: ${SARVAM_AGENT_PHONE_NUMBER:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-elite_wa_verify_token_2026}
      NVIDIA_NEMOTRON_API_KEY: ${NVIDIA_NEMOTRON_API_KEY:-}
      NVIDIA_NEMOTRON_MODEL: ${NVIDIA_NEMOTRON_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      META_LLAMA_API_KEY: ${META_LLAMA_API_KEY:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-in-production}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      SHEET_CSV_URL: ${SHEET_CSV_URL:-}
      SHEET_SYNC_MINUTES: ${SHEET_SYNC_MINUTES:-15}
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
    volumes:
      - elite_practo_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  elite_practo_data:
